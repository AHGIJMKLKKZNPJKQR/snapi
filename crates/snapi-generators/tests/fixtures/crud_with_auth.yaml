openapi: "3.1.0"
info:
  title: Todo API
  version: "2.0.0"
  description: "A simple todo list API with auth"
servers:
  - url: https://api.todo.example.com

paths:
  /todos:
    get:
      operationId: listTodos
      summary: List all todos
      tags: [todos]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      summary: Create a todo
      tags: [todos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoInput"
      responses:
        "201":
          description: Created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"

  /todos/{id}:
    get:
      operationId: getTodo
      summary: Get a todo by ID
      tags: [todos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: Not found
    put:
      operationId: updateTodo
      summary: Update a todo
      tags: [todos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTodoInput"
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      tags: [todos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: string
          description: Unique identifier
        title:
          type: string
          description: Todo title
        done:
          type: boolean
          description: Completion status
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTodoInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        done:
          type: boolean

    UpdateTodoInput:
      type: object
      properties:
        title:
          type: string
        done:
          type: boolean
